services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: fashion-search-postgres
    environment:
      POSTGRES_DB: fashion
      POSTGRES_USER: fashion
      POSTGRES_PASSWORD: fashion
    ports:
      - "5432:5432"
    volumes:
      - fashion_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fashion -d fashion"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  fashion_postgres_data:
